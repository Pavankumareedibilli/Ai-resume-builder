<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- background -->
  <rect x="0" y="0" width="512" height="512" rx="72" fill="#F7F4FF"/>

  <!-- resume card -->
  <rect x="60" y="60" width="280" height="392" rx="28" fill="#FFFFFF" />

  <!-- avatar background -->
  <rect x="88" y="86" width="96" height="96" rx="20" fill="#3F8FFF"/>

  <!-- avatar face -->
  <circle cx="136" cy="134" r="34" fill="#FFE0C2"/>
  <!-- hair -->
  <path d="M110 124c4-22 20-36 40-36 18 0 30 10 34 30-6-4-14-6-24-6-10 0-18 2-24 6-6-4-16-4-26 6z"
        fill="#1C2B4A"/>
  <!-- eyes -->
  <circle cx="124" cy="134" r="3.5" fill="#2C2131"/>
  <circle cx="148" cy="134" r="3.5" fill="#2C2131"/>
  <!-- mouth -->
  <path d="M122 148c4 8 10 12 14 12s10-4 14-12" stroke="#E06666" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- top lines on resume -->
  <rect x="204" y="94" width="114" height="10" rx="5" fill="#D5D8F0"/>
  <rect x="204" y="114" width="96" height="10" rx="5" fill="#E3E5F5"/>
  <rect x="204" y="134" width="82" height="10" rx="5" fill="#E3E5F5"/>

  <!-- left text blocks -->
  <rect x="88" y="206" width="184" height="10" rx="5" fill="#D5D8F0"/>
  <rect x="88" y="226" width="160" height="10" rx="5" fill="#E3E5F5"/>
  <rect x="88" y="246" width="172" height="10" rx="5" fill="#E3E5F5"/>
  <rect x="88" y="266" width="148" height="10" rx="5" fill="#E3E5F5"/>

  <!-- separator line -->
  <rect x="88" y="294" width="184" height="4" rx="2" fill="#EEF0FB"/>

  <!-- colored info pills -->
  <rect x="100" y="318" width="70" height="22" rx="11" fill="#FF6B6B"/>
  <rect x="180" y="318" width="70" height="22" rx="11" fill="#FFE06B"/>

  <rect x="100" y="352" width="70" height="22" rx="11" fill="#4EC8A0"/>
  <rect x="180" y="352" width="70" height="22" rx="11" fill="#C9D2FF"/>

  <!-- bottom line -->
  <rect x="100" y="392" width="120" height="10" rx="5" fill="#B3A4FF"/>

  <!-- PEN -->
  <!-- shadow -->
  <ellipse cx="364" cy="420" rx="64" ry="18" fill="#E0D6FF"/>

  <!-- pen body -->
  <rect x="344" y="132" width="40" height="230" rx="16" fill="#FFB347"/>
  <!-- pen clip -->
  <path d="M380 156h22c6 0 10 4 10 10v84" stroke="#315E9F" stroke-width="10" stroke-linecap="round"/>
  <!-- pen top -->
  <circle cx="364" cy="128" r="24" fill="#FF4F6A"/>
  <!-- pen tip section -->
  <rect x="344" y="354" width="40" height="52" rx="10" fill="#334155"/>
  <!-- pen tip -->
  <path d="M364 412l-10 18h20l-10-18z" fill="#111827"/>

</svg>
